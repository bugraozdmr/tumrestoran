
name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Flutter for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get
          cd ios && pod install --repo-update && cd ..


      - name: Build iOS Simulator app
        run: |
          flutter build ios \
            --simulator \
            --debug

      - name: Package simulator app
        shell: bash
        run: |
          APP_PATH="$(find build/ios/iphonesimulator \
            -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "iOS Simulator app bulunamadi."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ios-simulator-app.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          retention-days: 7
