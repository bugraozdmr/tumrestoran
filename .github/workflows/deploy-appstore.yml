name: Deploy to App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get
          cd ios && pod install --repo-update && cd ..


      - name: Import Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/04d61a54-c5e8-495f-a2d6-b1b29e84b9a7.mobileprovision
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Tum_Restoran.mobileprovision

      - name: Verify Code Signing Identity
        run: |
          security find-identity -v -p codesigning

      - name: Build IPA
        run: |
          flutter build ipa --release --no-codesign --export-options-plist=ios/ExportOptions.plist

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Upload to App Store Connect
        run: |
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "IPA dosyasi bulunamadi!"
            exit 1
          fi
          echo "Yukleniyor: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Upload IPA as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
