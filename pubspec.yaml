name: foodnanny
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  flutter_screenutil: ^5.9.0
  get: ^4.6.6
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_typeahead: ^5.2.0
  cached_network_image: ^3.3.1
  dotted_dashed_line: ^0.0.3
  easy_stepper: ^0.8.3
  get_storage: ^2.1.1
  dartz: ^0.10.1
  dio: ^5.4.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  flutter_html: 3.0.0-beta.2
  flutter_staggered_grid_view: ^0.7.0
  equatable: ^2.0.5
  flutter_inappwebview: ^6.1.5
  shimmer: ^3.0.0
  badges: ^3.1.2
  google_api_headers: any
  phone_form_field: ^10.0.14
  url_launcher: ^6.3.2
  http: ^1.6.0
  scrollable_positioned_list: ^0.3.8
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  google_api_headers: ^4.3.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/bottom_nav/
    - assets/icons/inactive/
    - assets/gif/
    - assets/fonts/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900
